<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0b10">
<title>RH MUSIC — личный музыкальный плеер</title>
<style>
:root{color-scheme:dark;--bg:#0a0b10;--panel:#121522;--panel2:#191d2d;--text:#f5f6ff;--muted:#969bb3;--blue:#4a5cff;--purple:#8a2be2;--line:#262b40}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -20%,#25204a 0,transparent 45%),var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;padding-bottom:112px}
button,input{font:inherit}button{cursor:pointer;color:inherit;border:0}button:focus-visible,input:focus-visible{outline:2px solid #8c96ff;outline-offset:2px}
.app{max-width:1200px;margin:auto;padding:24px 24px 30px}.top{display:flex;align-items:center;gap:14px;margin-bottom:26px}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#00d4ff,#8a2be2);display:grid;place-items:center;font-weight:950;font-size:19px;box-shadow:0 8px 30px #4a5cff35}.brand{font-weight:850;letter-spacing:1.8px;font-size:18px}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:1px;font-weight:500;margin-top:1px}
.hero{padding:28px;border:1px solid #ffffff12;border-radius:24px;background:linear-gradient(120deg,#171b2d,#12121f 70%,#211638);margin-bottom:24px}.hero h1{font-size:clamp(27px,5vw,43px);line-height:1.08;margin:0 0 10px;letter-spacing:-1.2px}.hero p{color:var(--muted);margin:0 0 22px;max-width:640px}.search{display:flex;gap:10px;max-width:760px}.search input{min-width:0;flex:1;border:1px solid #ffffff18;border-radius:14px;background:#080a12;color:var(--text);padding:15px 16px}.primary{border-radius:14px;padding:0 22px;background:linear-gradient(135deg,var(--blue),var(--purple));font-weight:750;white-space:nowrap}.primary:disabled{opacity:.6;cursor:wait}
.status{color:var(--muted);font-size:13px;min-height:22px;margin:12px 2px 0}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:24px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:0 0 14px}.section-head h2{font-size:20px;margin:0}.muted{color:var(--muted);font-size:13px}
.results{display:grid;gap:8px}.track{display:flex;align-items:center;gap:13px;padding:10px;border-radius:15px;border:1px solid transparent;background:#ffffff05;min-width:0}.track:hover{background:#ffffff0b;border-color:#ffffff12}.cover{width:58px;height:58px;flex:none;border-radius:11px;object-fit:cover;background:linear-gradient(135deg,#252a49,#42225b)}.track-info{min-width:0;flex:1}.track-title{font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.track-artist{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.track-actions{display:flex;gap:7px;align-items:center}.icon-btn{width:38px;height:38px;border-radius:12px;background:#ffffff0a;display:grid;place-items:center;font-size:17px}.icon-btn:hover{background:#4a5cff30}.play{background:#4a5cff24;color:#b8bdff}.side-card{background:var(--panel);border:1px solid #ffffff0c;border-radius:20px;padding:18px;margin-bottom:14px}.side-card h3{margin:0 0 12px;font-size:16px}.empty{padding:26px 18px;text-align:center;color:var(--muted);background:#ffffff04;border:1px dashed #ffffff16;border-radius:16px}.library-list{display:grid;gap:7px}.library-item{display:flex;align-items:center;gap:10px;min-width:0;padding:7px;border-radius:12px}.library-item:hover{background:#ffffff08}.library-item .cover{width:42px;height:42px;border-radius:8px}.library-item .track-info{cursor:pointer}.tag{display:inline-block;padding:5px 8px;border:1px solid #ffffff16;border-radius:999px;color:var(--muted);font-size:11px;margin:3px 4px 0 0}
.player{position:fixed;z-index:5;left:0;right:0;bottom:0;padding:12px max(18px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));background:#0c0e16ed;backdrop-filter:blur(24px);border-top:1px solid #ffffff16}.player-inner{max-width:1200px;margin:auto;display:grid;grid-template-columns:minmax(150px,1fr) minmax(220px,1.3fr) minmax(100px,1fr);gap:22px;align-items:center}.now{display:flex;align-items:center;gap:11px;min-width:0}.now .cover{width:48px;height:48px}.controls{display:grid;gap:5px;min-width:0}.control-buttons{display:flex;align-items:center;justify-content:center;gap:18px}.big-play{width:38px;height:38px;border-radius:50%;background:#f4f5ff;color:#11131b;font-size:17px}.timebar{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:11px}.timebar input{width:100%;accent-color:#8b83ff}.volume{display:flex;align-items:center;justify-content:flex-end;gap:9px}.volume input{width:95px;accent-color:#8b83ff}.source{font-size:10px;color:#8c91ad;margin-top:3px}
@media(max-width:800px){.app{padding:18px 14px 24px}.layout{grid-template-columns:1fr}.sidebar{display:grid;grid-template-columns:1fr 1fr;gap:12px}.side-card{margin:0}.player-inner{grid-template-columns:minmax(0,1fr) auto;gap:12px}.controls{grid-column:1/-1;grid-row:2}.volume{display:none}.player{padding-top:9px}.player-inner{grid-template-columns:minmax(0,1fr);gap:5px}.now{display:none}.controls{grid-column:auto;grid-row:auto}.control-buttons{gap:25px}.hero{padding:22px 17px}.search{gap:8px}.primary{padding:0 15px}.track{gap:9px}.cover{width:50px;height:50px}.track-actions{gap:4px}.icon-btn{width:35px;height:35px}}
@media(max-width:420px){.sidebar{grid-template-columns:1fr}.search input{padding:13px 12px}.primary{padding:0 12px}.track-title{font-size:14px}.track-artist{font-size:12px}}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="logo">RH</div><div class="brand">RH MUSIC<small>YOUR PERSONAL PLAYER</small></div></header>
  <section class="hero">
    <h1>Твоя музыка.<br>Твой ритм.</h1>
    <p>Ищи композиции в открытом каталоге и слушай их прямо здесь. Добавляй треки в свою библиотеку — загружать MP3 вручную не нужно.</p>
    <form id="searchForm" class="search"><input id="query" type="search" placeholder="Название песни или исполнитель…" autocomplete="off" required><button id="searchBtn" class="primary" type="submit">Найти музыку</button></form>
    <div id="status" class="status" role="status">Источник: Audius. Каталог зависит от доступности треков.</div>
