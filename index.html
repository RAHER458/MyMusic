<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090d18"><title>RH Forum — сообщество</title>
<style>
:root{--bg:#080c15;--panel:#101827;--panel2:#131e30;--line:#24334b;--text:#edf2ff;--muted:#8795ad;--blue:#6376ff;--purple:#9b68ff;--green:#55d6a5;--radius:15px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#1a2450 0,transparent 45%),var(--bg);color:var(--text);font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.wrap{width:min(1180px,calc(100% - 32px));margin:auto}.top{position:sticky;top:0;z-index:10;background:#090e1beF;backdrop-filter:blur(18px);border-bottom:1px solid #25324a}.topin{height:70px;display:flex;align-items:center;gap:25px}.brand{display:flex;align-items:center;gap:11px;color:var(--text);text-decoration:none;font-weight:900;font-size:20px;letter-spacing:.4px}.logo{width:39px;height:39px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#5272ff,#a04cff);box-shadow:0 5px 25px #655cff55;font-weight:950}.brand span{color:#9d8aff}.nav{display:flex;gap:6px;flex:1}.nav button,.ghost{border:0;background:transparent;color:#aab6ca;padding:10px 13px;border-radius:10px}.nav button:hover,.nav button.active,.ghost:hover{background:#1b2740;color:#fff}.search{width:min(270px,28vw);position:relative}.search input{width:100%;background:#111b2b;border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:#fff;outline:none}.search input:focus,.field input:focus,.field textarea:focus{border-color:#7181ff}.userbar{display:flex;align-items:center;gap:9px}.avatar{width:34px;height:34px;flex:none;border-radius:11px;background:linear-gradient(135deg,#526bff,#9855d9);display:grid;place-items:center;font-weight:900;color:white}.btn{border:0;border-radius:10px;padding:10px 15px;background:linear-gradient(110deg,#536dff,#8956e9);color:white;font-weight:800;box-shadow:0 5px 20px #526dff30}.btn:hover{filter:brightness(1.12)}.btn.secondary{background:#1b2941;border:1px solid #354766;box-shadow:none;color:#dce5fa}.btn.danger{background:#542b3a;border:1px solid #81465b;box-shadow:none}.hero{margin:25px 0 18px;padding:27px 30px;border:1px solid #34416a;border-radius:20px;background:linear-gradient(115deg,#182449,#171b35 55%,#282044);position:relative;overflow:hidden}.hero:after{content:"RH";position:absolute;right:25px;top:-45px;font-size:190px;font-weight:1000;color:#fff;opacity:.035;pointer-events:none}.eyebrow{color:#9d9cff;font-size:10px;font-weight:900;letter-spacing:2px}.hero h1{font-size:30px;margin:5px 0 4px;letter-spacing:-.8px}.hero p{color:#aebbd2;margin:0;max-width:650px}.crumb{color:var(--muted);font-size:12px;margin:16px 0}.crumb button{border:0;background:none;color:#9baeff;padding:0}.layout{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:20px;align-items:start}.panel{background:linear-gradient(180deg,#111b2a,#0e1725);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:15px}.panel-head{padding:14px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.panel-head h2{font-size:14px;margin:0}.panel-head small{color:var(--muted)}.category-head{padding:12px 17px;background:#17243a;color:#b8c8e8;font-size:11px;font-weight:900;letter-spacing:1px;text-transform:uppercase}.forum-row{display:grid;grid-template-columns:48px minmax(0,1fr) 105px 190px;gap:13px;align-items:center;padding:15px 17px;border-bottom:1px solid #202d42}.forum-row:last-child{border:0}.forum-icon{width:43px;height:43px;border-radius:13px;background:linear-gradient(145deg,#243b68,#352b61);display:grid;place-items:center;font-size:19px;color:#aebdff}.forum-title{font-weight:800;color:#eaf0ff;font-size:14px;cursor:pointer}.forum-title:hover,.thread-title:hover{color:#a9b4ff}.forum-desc{font-size:11px;color:var(--muted);margin-top:3px}.forum-stats{text-align:center;color:#aab6ca;font-size:11px}.forum-stats b{display:block;color:#e2eaff;font-size:13px}.last-post{font-size:10px;color:var(--muted);line-height:1.5}.last-post strong{display:block;color:#c8d5f1;font-size:11px}.last-post button{color:#a9b3ff;background:none;border:0;padding:0}.sidebox{padding:16px}.sidebox h3{margin:0 0 12px;font-size:13px}.sidebox p{color:var(--muted);font-size:11px;margin:5px 0}.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{padding:10px;background:#172338;border-radius:10px}.stat b{display:block;font-size:18px}.stat span{font-size:10px;color:var(--muted)}.tag{display:inline-block;padding:3px 7px;border-radius:6px;background:#253253;color:#b7c5ff;font-size:9px;font-weight:800}.thread-row{display:grid;grid-template-columns:40px minmax(0,1fr) 125px;gap:12px;padding:14px 16px;border-bottom:1px solid #202d42;align-items:center}.thread-row:last-child{border:0}.thread-title{font-weight:750;cursor:pointer}.thread-meta{font-size:10px;color:var(--muted);margin-top:4px}.thread-numbers{text-align:right;font-size:10px;color:var(--muted)}.thread-numbers b{color:#dce6fa}.post{display:grid;grid-template-columns:165px minmax(0,1fr);border-bottom:1px solid var(--line)}.post:last-child{border:0}.post-user{padding:18px;background:#111c2c;border-right:1px solid var(--line);text-align:center}.post-user .avatar{width:55px;height:55px;margin:0 auto 8px;border-radius:17px;font-size:18px}.post-user strong{display:block;font-size:12px}.post-user small{color:var(--muted);font-size:10px}.post-content{padding:18px;min-width:0}.post-date{color:var(--muted);font-size:10px;margin-bottom:12px}.post-text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.75}.post-actions{display:flex;gap:8px;margin-top:15px;flex-wrap:wrap}.post-actions button{background:#1b2940;border:1px solid #2e405d;border-radius:8px;color:#b9c8e5;padding:6px 10px;font-size:10px}.field{margin:13px 0}.field label{display:block;color:#bdc9df;font-size:11px;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:12px;border-radius:10px;border:1px solid #2c3b55;background:#0a1220;color:#f2f5ff;outline:none}.field textarea{min-height:170px;resize:vertical}.form-panel{padding:20px}.empty{text-align:center;padding:35px 20px;color:var(--muted)}.empty b{display:block;color:#e3eaff;font-size:14px;margin-bottom:5px}.notice{padding:12px 14px;background:#171f35;border:1px solid #344269;border-radius:10px;color:#aebce0;font-size:10px;margin:14px 0}.auth{min-height:calc(100vh - 70px);display:grid;place-items:center;padding:30px 15px}.auth-card{width:min(430px,100%);padding:26px;background:#111b2a;border:1px solid var(--line);border-radius:18px}.auth-card h2{margin:5px 0}.auth-tabs{display:flex;background:#0a1220;border-radius:10px;padding:4px;margin:17px 0}.auth-tabs button{flex:1;background:none;border:0;color:var(--muted);padding:9px;border-radius:8px}.auth-tabs button.active{background:#27375a;color:white}.foot{color:#66758f;text-align:center;font-size:10px;padding:28px 0 40px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#253755;border:1px solid #536a9a;padding:11px 17px;border-radius:10px;z-index:30;box-shadow:0 10px 40px #0008}.mobile-menu{display:none}
@media(max-width:900px){.layout{grid-template-columns:1fr}.rightcol{display:grid;grid-template-columns:1fr 1fr;gap:12px}.rightcol .panel{margin:0}.topin{gap:10px}.nav{gap:0}.nav button{padding:9px 8px;font-size:11px}.search{width:180px}.forum-row{grid-template-columns:43px minmax(0,1fr) 80px}.last-post{display:none}}
@media(max-width:620px){.wrap{width:min(100% - 20px,1180px)}.topin{height:60px;flex-wrap:wrap;gap:8px}.brand{font-size:17px}.logo{width:34px;height:34px}.nav{order:3;flex-basis:100%;overflow:auto;display:none}.nav.open{display:flex}.search{flex:1;width:auto}.userbar .username{display:none}.top{position:relative}.hero{padding:20px;margin-top:14px}.hero h1{font-size:24px}.hero:after{font-size:120px;right:5px;top:-15px}.forum-row{grid-template-columns:39px minmax(0,1fr) 62px;gap:9px;padding:12px}.forum-icon{width:37px;height:37px}.forum-title{font-size:12px}.forum-desc{font-size:10px}.forum-stats{font-size:9px}.forum-stats b{font-size:12px}.thread-row{grid-template-columns:34px minmax(0,1fr);gap:9px;padding:12px}.thread-numbers{grid-column:2;text-align:left}.post{grid-template-columns:1fr}.post-user{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 14px;border-right:0;border-bottom:1px solid var(--line)}.post-user .avatar{width:35px;height:35px;margin:0;border-radius:10px;font-size:12px}.post-user small{display:block}.post-content{padding:14px}.rightcol{grid-template-columns:1fr}.mobile-menu{display:block}.crumb{margin:12px 0}.hero p{font-size:12px}}
</style></head><body>
<header class="top"><div class="wrap topin"><a class="brand" href="#" id="brand"><div class="logo">RH</div><div>RH <span>FORUM</span></div></a><button class="ghost mobile-menu" id="menuBtn">☰</button><nav class="nav" id="nav"><button class="active" data-page="home">Форум</button><button data-page="new">Новые сообщения</button><button data-page="members">Пользователи</button></nav><div class="search"><input id="globalSearch" placeholder="Поиск по форуму..." type="search"></div><div class="userbar" id="userbar"><button class="ghost" data-open-login>Вход</button><button class="btn" data-open-register>Регистрация</button></div></div></header>
<div class="wrap"><section class="hero"><div class="eyebrow">RH COMMUNITY PLATFORM</div><h1>Форум RH</h1><p>Общайся, делись опытом, задавай вопросы и находи единомышленников.</p></section><div class="crumb" id="crumb">Главная / Форум</div><main id="view"></main><footer class="foot">RH FORUM · COMMUNITY · <span id="year"></span><br>Локальная версия форума. Серверная синхронизация будет подключена отдельным этапом.</footer></div>
<div id="toast" class="toast hidden"></div>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id), DB="rh_forum_v1", SESSION="rh_forum_session_v1";
let state={users:{},threads:[],categories:[]},me=null,page="home",forumId=null,threadId=null,authMode="login",searchTerm="";
const defaults=[
{id:"news",name:"Новости и объявления",icon:"📢",desc:"Новости проекта, обновления форума и важные объявления.",forums:[{id:"announcements",name:"Официальные объявления",desc:"Важная информация от администрации",icon:"📌"},{id:"updates",name:"Обновления и планы",desc:"Обсуждаем новые функции и планы развития",icon:"🚀"}]},
{id:"community",name:"Сообщество",icon:"🌐",desc:"Общение участников, знакомства и свободные темы.",forums:[{id:"general",name:"Общий раздел",desc:"Общение на любые темы",icon:"💬"},{id:"introductions",name:"Знакомства",desc:"Расскажи о себе и познакомься с участниками",icon:"👋"},{id:"offtopic",name:"Флудилка",desc:"Свободное общение и разговоры обо всём",icon:"☕"}]},
{id:"help",name:"Помощь и поддержка",icon:"🛠️",desc:"Вопросы, инструкции, помощь сообщества.",forums:[{id:"questions",name:"Вопросы и ответы",desc:"Задай вопрос и получи помощь",icon:"❔"},{id:"guides",name:"Гайды и инструкции",desc:"Полезные руководства от участников",icon:"📚"},{id:"ideas",name:"Предложения",desc:"Идеи по улучшению RH и форума",icon:"💡"}]},
{id:"projects",name:"Проекты и разработки",icon:"💻",desc:"Обсуждение проектов, разработки и технологий.",forums:[{id:"development",name:"Разработка",desc:"Программирование, сайты и приложения",icon:"⌨️"},{id:"showcase",name:"Наши работы",desc:"Покажи свои проекты сообществу",icon:"🎨"}]}
];
function load(){try{const x=JSON.parse(localStorage.getItem(DB)||"null");if(x&&x.users&&x.threads){state=x;if(!state.categories?.length)state.categories=defaults}else{state={users:{},threads:[],categories:defaults};save()}}catch(e){state={users:{},threads:[],categories:defaults};save()}}
function save(){localStorage.setItem(DB,JSON.stringify(state))}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function date(v){return new Date(v).toLocaleString("ru-RU",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}
function toast(t){$("toast").textContent=t;$("toast").classList.remove("hidden");setTimeout(()=>$("toast").classList.add("hidden"),2300)}
function initial(u){return (u?.displayName||u?.username||"?").trim()[0].toUpperCase()}
function isAdmin(){return me&&me.username.toLowerCase()==="raher"}
function user(u){return state.users[String(u||"").toLowerCase()]||{username:u||"unknown",displayName:u||"Участник",posts:0,joined:new Date().toISOString()}}
function setPage(p){page=p;forumId=null;threadId=null;render()}
function stats(fid){const ts=state.threads.filter(t=>t.forumId===fid);return {threads:ts.length,replies:ts.reduce((n,t)=>n+t.posts.length-1,0),last:ts.sort((a,b)=>new Date(b.updated)-new Date(a.updated))[0]}}
function layout(content,side=true){return '<div class="layout"><section>'+content+'</section>'+(side?'<aside class="rightcol">'+sideWidgets()+'</aside>':'')+'</div>'}
function sideWidgets(){return '<section class="panel"><div class="sidebox"><h3>Добро пожаловать!</h3><p>RH Forum — место, где идеи превращаются в обсуждения.</p><p>Создавай темы, отвечай участникам и сохраняй полезные материалы.</p></div></section><section class="panel"><div class="sidebox"><h3>Статистика форума</h3><div class="stat-grid"><div class="stat"><b>'+Object.keys(state.users).length+'</b><span>Участников</span></div><div class="stat"><b>'+state.threads.length+'</b><span>Тем</span></div><div class="stat"><b>'+state.threads.reduce((n,t)=>n+t.posts.length,0)+'</b><span>Сообщений</span></div><div class="stat"><b>'+state.categories.length+'</b><span>Категорий</span></div></div></div></section><section class="panel"><div class="sidebox"><h3>Быстрые ссылки</h3><p><a href="#" data-action="new" style="color:#aeb8ff">Новые сообщения</a></p><p><a href="#" data-action="members" style="color:#aeb8ff">Список участников</a></p><p><a href="#" data-action="rules" style="color:#aeb8ff">Правила форума</a></p></div></section></aside></div>'}
function forumRow(f){const st=stats(f.id),last=st.last,author=last?user(last.posts[last.posts.length-1].author):null;return '<div class="forum-row"><div class="forum-icon">'+esc(f.icon||"▣")+'</div><div><div class="forum-title" data-forum="'+esc(f.id)+'">'+esc(f.name)+'</div><div class="forum-desc">'+esc(f.desc||"")+'</div></div><div class="forum-stats"><b>'+st.threads+'</b> тем · <b>'+st.replies+'</b> отв.</div><div class="last-post">'+(last?'<strong>'+esc(last.title)+'</strong><span>'+date(last.updated)+' · <button data-profile="'+esc(author.username)+'">'+esc(author.displayName)+'</button></span>':'Пока нет сообщений')+'</div></div>'}
function home(){let out='';state.categories.forEach(cat=>{out+='<section class="panel"><div class="category-head">'+esc(cat.icon)+' &nbsp;'+esc(cat.name)+'</div>'+cat.forums.map(f=>forumRow(f)).join("")+'</section>'});return layout(out)}
function findForum(id){for(const c of state.categories){const f=c.forums.find(x=>x.id===id);if(f)return f}return null}
function forumView(id){const f=findForum(id);if(!f)return home();const topics=state.threads.filter(t=>t.forumId===id).sort((a,b)=>b.pinned-a.pinned||new Date(b.updated)-new Date(a.updated));let rows=topics.map(t=>{const author=user(t.author),last=t.posts[t.posts.length-1],lastUser=user(last.author);return '<div class="thread-row"><div class="avatar">'+initial(author)+'</div><div><div class="thread-title" data-thread="'+t.id+'">'+(t.pinned?'<span class="tag">ЗАКРЕПЛЕНО</span> ':"")+(t.locked?'<span class="tag">ЗАКРЫТО</span> ':"")+esc(t.title)+'</div><div class="thread-meta">Автор: <button class="ghost" data-profile="'+esc(author.username)+'">'+esc(author.displayName)+'</button> · '+date(t.created)+'</div></div><div class="thread-numbers"><b>'+t.posts.length+'</b> сообщений<br>Последний: '+esc(lastUser.displayName)+'<br>'+date(t.updated)+'</div></div>'}).join("");return layout('<section class="panel"><div class="panel-head"><div><h2>'+esc(f.icon)+' '+esc(f.name)+'</h2><small>'+esc(f.desc)+'</small></div><button class="btn" data-action="create" data-forum="'+id+'">＋ Создать тему</button></div>'+(rows||'<div class="empty"><b>В этом разделе пока нет тем</b>Будь первым, кто начнёт обсуждение.</div>')+'</section>')}
function threadView(id){const t=state.threads.find(x=>x.id===id);if(!t)return home();const f=findForum(t.forumId);let posts=t.posts.map((p,i)=>{const u=user(p.author);return '<article class="post" id="post-'+i+'"><div class="post-user"><div class="avatar">'+initial(u)+'</div><div><strong>'+esc(u.displayName)+'</strong><small>@'+esc(u.username)+' · '+(u.role||"Участник")+'</small></div></div><div class="post-content"><div class="post-date">#'+(i+1)+' · '+date(p.created)+'</div><div class="post-text">'+esc(p.text)+'</div>'+(me?'<div class="post-actions"><button data-action="quote" data-post="'+i+'">↪ Цитировать</button><button data-action="report" data-post="'+i+'">⚑ Пожаловаться</button></div>':"")+'</div></article>'}).join("");return '<div class="crumb"><button data-page="home">Форум</button> / <button data-forum="'+f.id+'">'+esc(f.name)+'</button> / '+esc(t.title)+'</div>'+layout('<section class="panel"><div class="panel-head"><div><h2>'+esc(t.title)+'</h2><small>Автор: '+esc(user(t.author).displayName)+' · '+date(t.created)+'</small></div>'+(me&&!t.locked?'<button class="btn" data-action="reply">Ответить</button>':"")+'</div>'+posts+'</section>'+(me&&!t.locked?'<section class="panel form-panel" id="replyForm"><h3>Ответить в теме</h3><div class="field"><textarea id="replyText" placeholder="Напиши ответ..." maxlength="10000"></textarea></div><button class="btn" data-action="sendReply">Отправить ответ</button></section>':t.locked?'<div class="notice">Тема закрыта администрацией.</div>':""))}
function newView(){const ts=state.threads.slice().sort((a,b)=>new Date(b.updated)-new Date(a.updated));return layout('<section class="panel"><div class="panel-head"><h2>Новые сообщения</h2><small>Последняя активность сообщества</small></div>'+(ts.length?ts.map(t=>{const f=findForum(t.forumId),u=user(t.author);return '<div class="thread-row"><div class="avatar">'+initial(u)+'</div><div><div class="thread-title" data-thread="'+t.id+'">'+esc(t.title)+'</div><div class="thread-meta">'+esc(f?.name||"Раздел")+' · '+esc(u.displayName)+'</div></div><div class="thread-numbers">'+t.posts.length+' сообщений<br>'+date(t.updated)+'</div></div>'}).join(""):'<div class="empty">Пока нет новых сообщений.</div>')+'</section>')}
function members(){const us=Object.values(state.users).sort((a,b)=>a.username.localeCompare(b.username));return layout('<section class="panel"><div class="panel-head"><h2>Участники сообщества</h2><small>'+us.length+' зарегистрировано</small></div>'+(us.length?us.map(u=>'<div class="thread-row"><div class="avatar">'+initial(u)+'</div><div><div class="thread-title" data-profile="'+esc(u.username)+'">'+esc(u.displayName)+'</div><div class="thread-meta">@'+esc(u.username)+' · '+esc(u.bio||"Участник RH Forum")+'</div></div><div class="thread-numbers">Сообщений: '+(u.posts||0)+'</div></div>').join(""):'<div class="empty">Участников пока нет.</div>')+'</section>')}
function profile(name){const u=user(name),posts=state.threads.flatMap(t=>t.posts.map((p,i)=>({p,t,i}))).filter(x=>x.p.author===u.username.toLowerCase()).slice(-8).reverse();return layout('<section class="panel"><div class="sidebox" style="display:flex;gap:17px;align-items:center"><div class="avatar" style="width:68px;height:68px;font-size:25px">'+initial(u)+'</div><div><h2 style="margin:0">'+esc(u.displayName)+'</h2><div style="color:#9aa9c2">@'+esc(u.username)+'</div><p>'+esc(u.bio||"Участник RH Forum")+'</p><small>Регистрация: '+date(u.joined)+'</small></div></div></section><section class="panel"><div class="panel-head"><h2>Последние сообщения</h2></div>'+(posts.length?posts.map(x=>'<div class="thread-row"><div class="avatar">'+initial(u)+'</div><div><div class="thread-title" data-thread="'+x.t.id+'">'+esc(x.t.title)+'</div><div class="thread-meta">'+esc(x.p.text.slice(0,130))+'</div></div><div class="thread-numbers">'+date(x.p.created)+'</div></div>').join(""):'<div class="empty">Пользователь ещё не писал на форуме.</div>')+'</section>')}
function createForm(fid){const f=findForum(fid);if(!f)return;return '<section class="panel"><div class="panel-head"><h2>Создание новой темы</h2><small>'+esc(f.name)+'</small></div><div class="form-panel"><div class="field"><label>Заголовок темы</label><input id="topicTitle" maxlength="120" placeholder="Кратко сформулируй тему"></div><div class="field"><label>Текст сообщения</label><textarea id="topicText" maxlength="10000" placeholder="Опиши вопрос или начни обсуждение..."></textarea></div><button class="btn" data-action="publishTopic" data-forum="'+fid+'">Опубликовать тему</button> <button class="btn secondary" data-forum="'+fid+'" data-action="cancelCreate">Отмена</button></div></section>'}
function adminView(){return layout('<section class="panel"><div class="panel-head"><h2>Администрирование форума</h2><span class="tag">LOCAL ADMIN</span></div><div class="form-panel"><p>Управление категориями, темами и пользователями в этом браузере.</p><h3>Категории и разделы</h3>'+state.categories.map(c=>'<div class="notice"><b>'+esc(c.name)+'</b><br>'+c.forums.map(f=>esc(f.name)+' <button class="ghost" data-action="delForum" data-forum="'+f.id+'">Удалить</button>').join(" · ")+'</div>').join("")+'<div class="field"><label>Название нового раздела</label><input id="newForumName" placeholder="Например, Обратная связь"></div><div class="field"><label>Описание</label><input id="newForumDesc" placeholder="О чём этот раздел"></div><button class="btn" data-action="addForum">Добавить раздел</button><h3 style="margin-top:25px">Темы</h3>'+state.threads.map(t=>'<div class="notice">'+esc(t.title)+' <button class="ghost" data-action="togglePin" data-thread="'+t.id+'">'+(t.pinned?"Открепить":"Закрепить")+'</button><button class="ghost" data-action="toggleLock" data-thread="'+t.id+'">'+(t.locked?"Открыть":"Закрыть")+'</button><button class="ghost" data-action="deleteThread" data-thread="'+t.id+'">Удалить</button></div>').join("")+'</div></section>')}
function render(){const v=$("view");$("crumb").innerHTML=page==="home"?"Главная / Форум":page==="forum"?"Форум / "+esc(findForum(forumId)?.name||"Раздел"):page==="thread"?"Форум / Обсуждение":page==="members"?"Форум / Пользователи":page==="profile"?"Форум / Профиль":page==="admin"?"Форум / Администрирование":"Форум / Новые сообщения";if(page==="home")v.innerHTML=home();else if(page==="forum")v.innerHTML=forumView(forumId);else if(page==="thread")v.innerHTML=threadView(threadId);else if(page==="new")v.innerHTML=newView();else if(page==="members")v.innerHTML=members();else if(page==="profile")v.innerHTML=profile(forumId);else if(page==="create")v.innerHTML=createForm(forumId);else if(page==="admin")v.innerHTML=adminView();else v.innerHTML=home();document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));$("nav").classList.remove("open")}
function refreshUserbar(){const b=$("userbar");if(!me){b.innerHTML='<button class="ghost" id="loginOpen">Вход</button><button class="btn" id="registerOpen">Регистрация</button>'}else{b.innerHTML='<button class="ghost username" data-page="profile" data-profile="'+esc(me.username)+'">'+esc(me.displayName)+'</button>'+(isAdmin()?'<button class="ghost" data-page="admin">⚙</button>':"")+'<button class="ghost" id="logout">Выйти</button>'}}
function auth(mode){authMode=mode;const title=mode==="login"?"Вход на форум":"Регистрация";$("view").innerHTML='<section class="auth"><div class="auth-card"><div class="eyebrow">RH FORUM ACCOUNT</div><h2>'+title+'</h2><p style="color:var(--muted);font-size:11px">Аккаунт будет сохранён в браузере этого устройства.</p><div class="auth-tabs"><button class="'+(mode==="login"?"active":"")+'" data-auth="login">Вход</button><button class="'+(mode==="register"?"active":"")+'" data-auth="register">Регистрация</button></div><form id="authForm"><div class="field"><label>Логин</label><input id="authName" required minlength="3" maxlength="24" autocomplete="username" placeholder="Твой логин"></div>'+(mode==="register"?'<div class="field"><label>Отображаемое имя</label><input id="authDisplay" maxlength="32" placeholder="Как тебя будут видеть"></div>':"")+'<div class="field"><label>Пароль</label><input id="authPass" type="password" required minlength="8" maxlength="100" autocomplete="'+(mode==="login"?"current-password":"new-password")+'"></div><div id="authError" style="color:#ff9ba8;font-size:11px;margin:10px 0"></div><button class="btn" style="width:100%">'+(mode==="login"?"Войти":"Создать аккаунт")+'</button></form></div></section>'}
async function hash(p,salt){const key=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveBits"]);const bits=await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:new Uint8Array(salt.match(/.{2}/g).map(x=>parseInt(x,16))),iterations:120000},key,256);return Array.from(new Uint8Array(bits)).map(b=>b.toString(16).padStart(2,"0")).join("")}
function rand(){const b=new Uint8Array(12);crypto.getRandomValues(b);return Array.from(b).map(x=>x.toString(16).padStart(2,"0")).join("")}
function openThread(id){threadId=id;page="thread";render();window.scrollTo(0,0)}
function action(el){const a=el.dataset.action;if(a==="create"){if(!me)return auth("login");forumId=el.dataset.forum;page="create";render()}else if(a==="cancelCreate"){forumId=el.dataset.forum;page="forum";render()}else if(a==="publishTopic"){const title=$("topicTitle").value.trim(),text=$("topicText").value.trim();if(!title||!text)return toast("Заполни заголовок и текст");const t={id:rand(),forumId:el.dataset.forum,title,author:me.username.toLowerCase(),created:new Date().toISOString(),updated:new Date().toISOString(),pinned:false,locked:false,posts:[{author:me.username.toLowerCase(),text,created:new Date().toISOString()}]};state.threads.push(t);me.posts=(me.posts||0)+1;state.users[me.username.toLowerCase()]=me;save();openThread(t.id);toast("Тема опубликована")}else if(a==="reply"){ $("replyText")?.focus()}else if(a==="sendReply"){const text=$("replyText").value.trim(),t=state.threads.find(x=>x.id===threadId);if(!text||!t)return toast("Напиши сообщение");t.posts.push({author:me.username.toLowerCase(),text,created:new Date().toISOString()});t.updated=new Date().toISOString();me.posts=(me.posts||0)+1;state.users[me.username.toLowerCase()]=me;save();render();toast("Ответ добавлен")}else if(a==="quote"){const t=state.threads.find(x=>x.id===threadId),p=t.posts[Number(el.dataset.post)];$("replyText").value="> "+p.text.replace(/\n/g,"\n> ")+"\n\n";$("replyText").focus()}else if(a==="report"){const t=state.threads.find(x=>x.id===threadId);const reports=JSON.parse(localStorage.getItem("rh_forum_reports_v1")||"[]");reports.push({threadId:t.id,post:Number(el.dataset.post),by:me.username,created:new Date().toISOString()});localStorage.setItem("rh_forum_reports_v1",JSON.stringify(reports));toast("Жалоба сохранена локально")}else if(a==="addForum"){const name=$("newForumName").value.trim();if(!name)return toast("Введи название");state.categories[1].forums.push({id:"custom_"+rand(),name,desc:$("newForumDesc").value.trim(),icon:"📁"});save();render();toast("Раздел добавлен")}else if(a==="delForum"){if(!confirm("Удалить раздел и его темы?"))return;state.categories.forEach(c=>c.forums=c.forums.filter(f=>f.id!==el.dataset.forum));state.threads=state.threads.filter(t=>t.forumId!==el.dataset.forum);save();render()}else if(a==="togglePin"||a==="toggleLock"){const t=state.threads.find(x=>x.id===el.dataset.thread);if(t){if(a==="togglePin")t.pinned=!t.pinned;else t.locked=!t.locked;save();render()}}else if(a==="deleteThread"){if(!confirm("Удалить тему?"))return;state.threads=state.threads.filter(t=>t.id!==el.dataset.thread);save();render()}}
$("view").addEventListener("click",e=>{const b=e.target.closest("button,[data-forum],[data-thread],[data-profile]");if(!b)return;if(b.dataset.page){if(b.dataset.page==="profile"&&b.dataset.profile){forumId=b.dataset.profile;page="profile";render()}else setPage(b.dataset.page);return}if(b.dataset.auth){auth(b.dataset.auth);return}if(b.dataset.forum){if(b.dataset.action){action(b);return}forumId=b.dataset.forum;page="forum";render();return}if(b.dataset.thread){openThread(b.dataset.thread);return}if(b.dataset.profile){forumId=b.dataset.profile;page="profile";render();return}if(b.dataset.action)action(b)});
document.addEventListener("click",e=>{const b=e.target.closest("button,a");if(!b)return;if(b.id==="brand"){e.preventDefault();setPage("home")}if(b.id==="loginOpen"||b.hasAttribute("data-open-login"))auth("login");if(b.id==="registerOpen"||b.hasAttribute("data-open-register"))auth("register");if(b.id==="menuBtn")$("nav").classList.toggle("open");if(b.id==="logout"){me=null;localStorage.removeItem(SESSION);refreshUserbar();setPage("home");toast("Ты вышел из аккаунта")}if(b.dataset.page&&(b.closest("#nav")||b.dataset.profile||b.dataset.page==="admin")){if(b.dataset.page==="profile"&&b.dataset.profile){forumId=b.dataset.profile;page="profile";render()}else setPage(b.dataset.page)}if(b.dataset.action==="rules"){page="rules";$("view").innerHTML='<section class="panel form-panel"><h2>Правила RH Forum</h2><ol><li>Уважай других участников.</li><li>Не публикуй спам и вредоносные ссылки.</li><li>Выбирай подходящий раздел.</li><li>Не раскрывай чужие личные данные.</li><li>Соблюдай решения модераторов.</li></ol></section>'}});
document.addEventListener("submit",async e=>{if(e.target.id!=="authForm")return;e.preventDefault();const name=$("authName").value.trim(),pass=$("authPass").value,key=name.toLowerCase(),err=$("authError");if(!/^[a-zA-Z0-9_.]{3,24}$/.test(name)){err.textContent="Логин: 3–24 символа, латиница, цифры, точка или подчёркивание.";return}if(pass.length<8){err.textContent="Пароль должен быть не короче 8 символов.";return}try{if(authMode==="register"){if(state.users[key]){err.textContent="Такой логин уже занят.";return}const salt=rand(),passwordHash=await hash(pass,salt);me={username:name,displayName:$("authDisplay").value.trim()||name,bio:"",salt,passwordHash,joined:new Date().toISOString(),posts:0,role:key==="raher"?"Администратор":"Участник"};state.users[key]=me;save()}else{const u=state.users[key];if(!u){err.textContent="Аккаунт не найден.";return}if(await hash(pass,u.salt)!==u.passwordHash){err.textContent="Неверный пароль.";return}me=u}localStorage.setItem(SESSION,key);refreshUserbar();setPage("home");toast("Добро пожаловать на RH Forum!")}catch(x){err.textContent="Не удалось выполнить вход в этом браузере."}});
$("globalSearch").addEventListener("input",e=>{searchTerm=e.target.value.trim().toLowerCase();if(!searchTerm){render();return}const results=state.threads.filter(t=>(t.title+" "+t.posts.map(p=>p.text).join(" ")).toLowerCase().includes(searchTerm));$("crumb").textContent="Поиск по форуму";$("view").innerHTML='<section class="panel"><div class="panel-head"><h2>Результаты поиска</h2><small>'+results.length+' тем</small></div>'+(results.length?results.map(t=>'<div class="thread-row"><div class="avatar">'+initial(user(t.author))+'</div><div><div class="thread-title" data-thread="'+t.id+'">'+esc(t.title)+'</div><div class="thread-meta">'+esc(findForum(t.forumId)?.name||"")+'</div></div><div class="thread-numbers">'+t.posts.length+' сообщений</div></div>').join(""):'<div class="empty">Ничего не найдено.</div>')+'</section>'});
function init(){load();const key=localStorage.getItem(SESSION);if(key&&state.users[key])me=state.users[key];refreshUserbar();$("year").textContent=new Date().getFullYear();render()}
init();
})();
</script></body></html>
